# Render Blueprint - backend FastAPI (Aura Pogoda PWA)
# Wdrożenie: https://render.com -> New -> Blueprint -> wskaż to repozytorium
services:
  - type: web
    name: aura-pogoda-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_NAME
        value: aura_pogoda
      - key: CORS_ORIGINS
        value: "*"
      - key: MONGO_URL
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
